# Valores da VM Ampara (lidos por provisiona.sh, 01-infra.sh, 02-app.sh e monitor).
# Instalado em /etc/ampara/vm.conf so se ainda nao existir: pode ser ajustado por ssh.
# Rede padrao do QEMU: o IP fixo abaixo e o mesmo que o DHCP entregaria.
VM_HOSTNAME=ampara-vm
VM_IP=10.0.2.15/24
VM_GATEWAY=10.0.2.2
VM_DNS="10.0.2.3 1.1.1.1"
SRC_DIR=/opt/ampara/src
HEALTH_URL=http://127.0.0.1:5080/health
NODE_VERSION=22.12.0
PONTE_ASGI=app.main:app
DEMO=true
