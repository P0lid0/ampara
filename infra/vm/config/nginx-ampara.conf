# Ampara: nginx na porta 80 (instalado em /etc/nginx/sites-available/ampara).
# Contrato: / emergencia, /painel-risco/, /policia (painel da Ponte), /api/ e /hubs/ -> API, /ponte/ -> Ponte.

# X-Forwarded-Proto: respeita o do tunel/proxy a frente; sem ele usa o esquema da conexao.
map $http_x_forwarded_proto $ampara_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Pagina de emergencia (SPA).
    location / {
        root /var/www/ampara/emergencia;
        index index.html;
        try_files $uri /index.html;
    }

    # Painel Risco Cidadao (construido com --base=/painel-risco/).
    location = /painel-risco {
        return 301 /painel-risco/;
    }
    location /painel-risco/ {
        alias /var/www/ampara/painel-risco/;
        index index.html;
        try_files $uri $uri/ /painel-risco/index.html;
    }

    # Saude da API na raiz (200 saudavel, 503 falha).
    location = /health {
        proxy_pass http://127.0.0.1:5080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ampara_proto;
    }

    # Painel da Ponte: o prefixo /ponte faz o painel montar as chamadas em /ponte/..., que casa com location /ponte/.
    location /policia {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ampara_proto;
        proxy_set_header X-Forwarded-Prefix /ponte;
    }

    # API (mantem o prefixo).
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ampara_proto;
    }

    # SignalR (WebSocket).
    location /hubs/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ampara_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Ponte (remove o prefixo: /ponte/health -> /health).
    location /ponte/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ampara_proto;
    }
}
