# Limites e opções do monitor do Ampara (lido por ampara-monitor.sh).
# Instalado em /etc/ampara/monitor.conf; o monitor relê a cada início.
# Alerta quando o valor passa do limite (estritamente maior).
CPU_LIMITE=80
MEM_LIMITE=80
DISCO_LIMITE=85
# Segundos entre ciclos de verificação.
INTERVALO_S=5
# Mesmo tipo de alerta só se repete depois deste intervalo (evita encher o disco).
COOLDOWN_S=60
SERVICOS="postgresql ampara-api ampara-ponte nginx"
ALERTAS_LOG=/var/log/ampara/alertas.log
