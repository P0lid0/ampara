[pytest]
testpaths = tests
pythonpath = .
markers =
    postgres: testes que exigem um Postgres real (PONTE_DB_TEST)
filterwarnings =
    # O TestClient do Starlette 1.x avisa que prefere httpx2; o httpx 0.28 está fixado em
    # requirements-dev.txt e funciona. Rever ao trocar de versão.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
